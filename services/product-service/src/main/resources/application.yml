server:
  port: 8082
spring:
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventory}"
    username: "${POSTGRES_USER:inventory}"
    password: "${POSTGRES_PASSWORD:inventory}"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: product_service
  flyway:
    schemas: product_service
    default-schema: product_service
security:
  jwt-secret: "${JWT_SECRET}"
